name: Build & Deploy

on:
  push:
    branches:
      - main

  # Allows deployment from GitHub Actions manually
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npx tsx script/build.ts
        env:
          NODE_ENV: production

      - name: Upload dist artifact
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
          retention-days: 7

      - name: Setup SSH key
        run: |
          mkdir -p ~/.ssh

          printf '%s' "${{ secrets.HOSTINGER_SSH_KEY_B64 }}" \
            | base64 --decode > ~/.ssh/deploy_key

          chmod 600 ~/.ssh/deploy_key

          ssh-keyscan -H "${{ secrets.HOSTINGER_SSH_HOST }}" \
            >> ~/.ssh/known_hosts

          echo "=== Key fingerprint in use ==="
          ssh-keygen -lf ~/.ssh/deploy_key

      - name: Test SSH connection
        run: |
          ssh \
            -i ~/.ssh/deploy_key \
            -o IdentitiesOnly=yes \
            -o StrictHostKeyChecking=no \
            -o BatchMode=yes \
            -o ConnectTimeout=120 \
            "${{ secrets.HOSTINGER_SSH_USER }}@${{ secrets.HOSTINGER_SSH_HOST }}" \
            "echo SSH connection successful"

      - name: Upload built files to Hostinger
        run: |
          rsync -avz \
            -e "ssh \
              -i ~/.ssh/deploy_key \
              -o IdentitiesOnly=yes \
              -o StrictHostKeyChecking=no \
              -o ConnectTimeout=120" \
            dist/ package.json package-lock.json \
            "${{ secrets.HOSTINGER_SSH_USER }}@${{ secrets.HOSTINGER_SSH_HOST }}:/var/www/19dogs/"

      - name: Restart application on Hostinger
        run: |
          ssh \
            -i ~/.ssh/deploy_key \
            -o IdentitiesOnly=yes \
            -o StrictHostKeyChecking=no \
            -o ConnectTimeout=120 \
            "${{ secrets.HOSTINGER_SSH_USER }}@${{ secrets.HOSTINGER_SSH_HOST }}" \
            'cd /var/www/19dogs && \
             npm install --omit=dev && \
             pm2 restart 19dogs --update-env && \
             pm2 save && \
             echo "Deploy complete"'
